<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI·Thoughts — Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ee;
        --fg: #1c1917;
        --muted: #78716c;
        --accent: #0f766e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(1200px 600px at 20% -10%, #d9efe9, transparent),
          var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
        line-height: 1.45;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        padding: 0.7rem 1.25rem;
        font: 600 0.9rem system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Voices needs a connection to load takes. Your drafts stay on this device — try again when
        you’re back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
