name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Fails the build on new high/critical dependency vulnerabilities so a
      # hackable package can't ship silently. `high` (not the default `low`)
      # so an existing moderate advisory doesn't block unrelated PRs.
      - run: npm audit --audit-level=high
      # `next build` runs its own TypeScript check internally (and, unlike
      # a standalone `tsc --noEmit`, generates .next/types — e.g. LayoutProps
      # — before checking, so it doesn't need a prior build to pass).
      - run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-used-in-prod
          CRON_SECRET: ci-placeholder-cron-secret
          MONGODB_URL: mongodb://127.0.0.1:27017/aithoughts-ci
