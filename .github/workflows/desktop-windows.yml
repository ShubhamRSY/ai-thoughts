name: Desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        run: npm ci

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiTo-Windows
          path: desktop/dist/AiTo-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/AiTo-Setup-*.exe
          generate_release_notes: true
          body: |
            **AiTo for Windows**

            1. Download `AiTo-Setup-*.exe`
            2. Run the installer
            3. Open AiTo → sign in at aito.social

            Later updates install automatically when you restart the app.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
